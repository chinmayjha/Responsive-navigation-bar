<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--   Link and script  -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" defer>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" defer />

  <!--   Body -->
  <title>Responsive navigation bar</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/108121824?v=4" type="image/icon">
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <!--     Navigation -->
  <header>
    <div id="brand"><a href="index.html">Company</a></div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact us</a></li>
        <li>
          <input type="checkbox" class="checkbox" id="chk" />
          <label class="label" for="chk">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun"></i>
            <div class="ball"></div>
          </label>
        </li>
      </ul>
    </nav>
    <div id="hamburger-icon" 
         onclick="toggleMobileMenu(this)" 
         role="button" 
         tabindex="0"
         aria-label="Toggle navigation"
         aria-controls="mobile-menu"
         aria-expanded="false"
         onkeydown="if(event.key==='Enter'||event.key===' '){toggleMobileMenu(this)}">
      <div class="bar1"></div>
      <div class="bar2"></div>
      <div class="bar3"></div>
      <ul class="mobile-menu" id="mobile-menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact us</a></li>
        <li>
          <input type="checkbox" class="checkbox" id="chk-mobile" />
          <label class="label" for="chk-mobile">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun"></i>
            <div class="ball"></div>
          </label>
        </li>
      </ul>
    </div>
  </header>

<main id="main-content">
<h1 class="heading" style="text-align:center;">Hello, How are you?</h1>
  <p>Star us on <a href="https://github.com/Chinmayjha/Responsive-navigation-bar">Github</a></p>
</main>

<footer class="foot">
  <p class="credit">
    Made with ❤️ by
    <a
      href="https://chinmayjha.tech"
      class="chinmay-link"
      rel="noopener"
      >Chinmay</a
    >
  </p>
  <span class="copyright" id="copyright"></span>
</footer>

<script>
  // Dynamic copyright year on the right
  const copyright = document.getElementById("copyright");
  if (copyright) {
    copyright.textContent = `Copyright © ${new Date().getFullYear()}`;
  }
</script>
<script>
    const chk = document.getElementById('chk');
    const chkMobile = document.getElementById('chk-mobile');

    function toggleDarkMode() {
      document.body.classList.toggle('dark');
      // Sync both checkboxes
      if (chk && chkMobile) {
        const isDark = document.body.classList.contains('dark');
        chk.checked = isDark;
        chkMobile.checked = isDark;
      }
    }

    if (chk) {
      chk.addEventListener('change', toggleDarkMode);
    }
    
    if (chkMobile) {
      chkMobile.addEventListener('change', toggleDarkMode);
    }

    // Mobile menu toggle function
    function toggleMobileMenu(icon) {
      icon.classList.toggle('open');
      const mobileMenu = document.querySelector('.mobile-menu');
      const isOpen = icon.classList.contains('open');
      
      // Update aria-expanded for accessibility
      icon.setAttribute('aria-expanded', isOpen);
      
      if (isOpen) {
        mobileMenu.style.display = 'flex';
        // Focus trap implementation
        const focusableElements = mobileMenu.querySelectorAll('a, button, input, [tabindex]:not([tabindex="-1"])');
        if (focusableElements.length > 0) {
          focusableElements[0].focus();
        }
      } else {
        mobileMenu.style.display = 'none';
        // Return focus to toggle button
        icon.focus();
      }
    }

    // Close mobile menu when clicking outside
    document.addEventListener('click', function(event) {
      const hamburger = document.getElementById('hamburger-icon');
      const mobileMenu = document.querySelector('.mobile-menu');
      
      if (hamburger && mobileMenu && hamburger.classList.contains('open')) {
        if (!hamburger.contains(event.target) && !mobileMenu.contains(event.target)) {
          toggleMobileMenu(hamburger);
        }
      }
    });

    // Close mobile menu on escape key
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        const hamburger = document.getElementById('hamburger-icon');
        if (hamburger && hamburger.classList.contains('open')) {
          toggleMobileMenu(hamburger);
        }
      }
    });
    </script>
</body>
</html>
